<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: rgba(236, 236, 240, 0.95);
    --fg: #1c1c1e;
    --fg-dim: #6c6c70;
    --active-bg: #ffffff;
    --active-fg: #000000;
    --accent: #0066cc;
    --hover-bg: rgba(0, 0, 0, 0.05);
    --line: rgba(0, 0, 0, 0.12);
    --badge: #ff3b30;
    --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: rgba(38, 38, 42, 0.95);
      --fg: #ececec;
      --fg-dim: #98989d;
      /* Was #3a3a3e — measured contrast against --bg was 1.33:1, well under the
         3:1 WCAG floor for UI surfaces. Lightened, plus the accent underline
         below no longer relies on brightness alone to read as "selected". */
      --active-bg: #4c4c52;
      --active-fg: #ffffff;
      --accent: #0a84ff;
      --hover-bg: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.12);
      --badge: #ff453a;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
  }
  html[data-theme="dark"] {
    --bg: rgba(38, 38, 42, 0.95) !important;
    --fg: #ececec !important;
    --fg-dim: #98989d !important;
    --active-bg: #4c4c52 !important;
    --active-fg: #ffffff !important;
    --accent: #0a84ff !important;
    --hover-bg: rgba(255, 255, 255, 0.08) !important;
    --line: rgba(255, 255, 255, 0.12) !important;
    --badge: #ff453a !important;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
  }
  html[data-theme="light"] {
    --bg: rgba(236, 236, 240, 0.95) !important;
    --fg: #1c1c1e !important;
    --fg-dim: #6c6c70 !important;
    --active-bg: #ffffff !important;
    --active-fg: #000000 !important;
    --accent: #0066cc !important;
    --hover-bg: rgba(0, 0, 0, 0.05) !important;
    --line: rgba(0, 0, 0, 0.12) !important;
    --badge: #ff3b30 !important;
    --shadow: 0 1px 4px rgba(0, 0, 0, 0.08) !important;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    color: var(--fg);
    user-select: none;
    padding: 0 8px;
    gap: 4px;
    -webkit-app-region: drag;
  }

  .tabs-container {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-app-region: no-drag;
  }
  .tabs-container::-webkit-scrollbar { display: none; }

  button {
    -webkit-app-region: no-drag;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    font: inherit;
    color: var(--fg-dim);
    cursor: default;
    white-space: nowrap;
    transition: all 0.15s ease;
    outline: none;
  }
  button:hover {
    background: var(--hover-bg);
    color: var(--fg);
  }
  button[aria-selected='true'] {
    background: var(--active-bg);
    color: var(--active-fg);
    font-weight: 500;
    /* Accent underline reads as "selected" independent of brightness contrast,
       which a translucent bg over a variable desktop wallpaper can't guarantee. */
    box-shadow: var(--shadow), inset 0 -2px 0 var(--accent);
  }

  .tab-icon-wrap {
    position: relative;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .tab-icon {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    object-fit: contain;
  }

  /* "Is this tab actually going to notify me?" at a glance. 'live' shows nothing —
     the healthy case shouldn't compete for attention. Sized/positioned like a
     presence dot (Slack/Discord) so it reads as status, not decoration. */
  .status-dot {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--bg);
  }
  .status-dot.stale { background: #ffb020; }
  .status-dot.dead, .status-dot.login { background: var(--badge); }
  .status-dot.asleep { background: var(--fg-dim); }

  .tab-name {
    font-weight: 500;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    min-width: 18px;
    height: 16px;
    line-height: 16px;
    padding: 0 5px;
    border-radius: 8px;
    background: var(--badge);
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 1px 3px rgba(255, 59, 48, 0.4);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .muted { opacity: 0.45; }
  .empty {
    padding: 0 12px;
    color: var(--fg-dim);
    font-style: italic;
    -webkit-app-region: no-drag;
  }

  #add {
    font-size: 16px;
    font-weight: 400;
    padding: 0 8px;
    height: 26px;
    border-radius: 6px;
    color: var(--fg-dim);
  }
  #add:hover {
    color: var(--fg);
    background: var(--hover-bg);
  }

  .actions-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    -webkit-app-region: no-drag;
  }
  .icon-btn {
    position: relative;
    width: 28px;
    height: 26px;
    padding: 0;
    justify-content: center;
    border-radius: 6px;
    font-size: 14px;
  }
  /* Same dot language as the per-tab connection status — an update is just
     another "something needs your attention" signal, not a new visual system. */
  .icon-btn .status-dot { right: 2px; bottom: 2px; }
</style>
</head>
<body>
  <div class="tabs-container" id="tabs-list"></div>
  <div class="actions-right">
    <button class="icon-btn" id="settings" title="Settings">⚙️</button>
  </div>

<script>
  window.__tabs.onUpdate((data) => {
    const container = document.getElementById('tabs-list');
    container.textContent = '';

    const list = Array.isArray(data) ? data : (data.list || []);
    const genericIcon = (data && data.genericIcon) || '';
    const isMinimal = data && data.appMode === 'minimal';
    const isSetupOpen = data && data.setupOpen;
    const setupPage = data && data.setupPage;

    if (isMinimal) {
      // Minimal Mode Header
      const notifBtn = document.createElement('button');
      if (isSetupOpen) {
        notifBtn.ariaSelected = String(setupPage === 'history');
        notifBtn.append('🔔 Notifications');
      } else {
        notifBtn.append('⬅ Notifications');
      }
      notifBtn.onclick = () => window.__tabs.openHistory();
      container.append(notifBtn);
    } else {
      // Normal Mode Tabs Header
      if (!list.length) {
        const emptySpan = document.createElement('span');
        emptySpan.className = 'empty';
        emptySpan.textContent = 'No services added';
        container.append(emptySpan);
      } else {
        for (const s of list) {
          const btn = document.createElement('button');
          btn.ariaSelected = String(!isSetupOpen && s.active);
          if (s.muted) btn.classList.add('muted');

          const statusText = {
            stale: 'Quiet for a while — may have missed something',
            dead: 'Not receiving updates — check the tab',
            login: 'Needs sign-in — won’t notify until logged in',
            asleep: 'Sleeping to save memory (RAM optimization)',
          }[s.status];
          btn.title = [s.muted ? `${s.name} (Muted)` : s.name, statusText].filter(Boolean).join(' — ');

          // Service Icon (+ connection-status dot, skipped for the healthy 'live' case)
          const iconWrap = document.createElement('span');
          iconWrap.className = 'tab-icon-wrap';
          const img = document.createElement('img');
          img.className = 'tab-icon';
          img.src = s.icon || genericIcon;
          img.onerror = () => { img.src = genericIcon; };
          iconWrap.append(img);
          if (s.status && s.status !== 'live') {
            const dot = document.createElement('span');
            dot.className = 'status-dot ' + s.status;
            iconWrap.append(dot);
          }
          btn.append(iconWrap);

          // Service Name
          const nameSpan = document.createElement('span');
          nameSpan.className = 'tab-name';
          nameSpan.textContent = s.name;
          btn.append(nameSpan);

          if (s.muted) {
            const muteBadge = document.createElement('span');
            muteBadge.style.fontSize = '11px';
            muteBadge.textContent = '🔇';
            btn.append(muteBadge);
          }

          // Unread Count Badge
          if (s.unread) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = s.unread > 99 ? '99+' : s.unread;
            btn.append(badge);
          }

          btn.onclick = () => window.__tabs.select(s.id);
          btn.oncontextmenu = (e) => {
            e.preventDefault();
            if (window.__tabs.contextMenu) window.__tabs.contextMenu(s.id);
          };
          container.append(btn);
        }
      }

      // Add Service (+) Button
      const addBtn = document.createElement('button');
      addBtn.id = 'add';
      addBtn.title = 'Add a service';
      addBtn.textContent = '+';
      addBtn.onclick = () => window.__tabs.openSetup();
      container.append(addBtn);
    }

    // Settings Button
    const settingsBtn = document.getElementById('settings');
    settingsBtn.ariaSelected = String(isSetupOpen && setupPage === 'settings');
    settingsBtn.onclick = () => window.__tabs.openSettings();
    settingsBtn.title = data.updateAvailable ? `Settings — update available (v${data.latestVersion})` : 'Settings';
    const existingDot = settingsBtn.querySelector('.status-dot');
    if (existingDot) existingDot.remove();
    if (data.updateAvailable) {
      const dot = document.createElement('span');
      dot.className = 'status-dot stale'; // reuse the amber "needs attention" color
      settingsBtn.append(dot);
    }
  });
</script>
</body>
</html>
